@if (!cartService.isEmpty()) {
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-3.75 mt-7">
        <div>
            <div class="text-xl font-semibold mb-2">Orderer Information</div>
            <form 
                (ngSubmit)="onSubmitForm($event)"
                [formGroup]="orderForm">
        
                <div class="flex flex-col gap-2 mb-3">
                    <label class="form-label">Phone number</label>
                    <input pInputText pSize="large"
                        formControlName="phone"
                        name="txtphone"
                        type="text" class="form-control">
        
                        <app-error-validate 
                            [control]="orderForm.controls['phone']"
                            [name-control]="'Phone number'">
                        </app-error-validate>
                </div>
        
                <div class="flex flex-col gap-2 mb-3">
                    <label class="form-label">Name</label>
                    <input pInputText pSize="large"
                        formControlName="username"
                        name="txtUsername"
                        type="text" class="form-control">
        
                        <app-error-validate 
                            [control]="orderForm.controls['username']"
                            [name-control]="'Tên'">
                        </app-error-validate>
                </div>
            
                <div class="flex flex-col gap-2 mb-3">
                    <label class="form-label">Email</label>
                    <input pInputText pSize="large"
                        formControlName="email"
                        name="txtEmail"
                        type="email" class="form-control">
        
                        <app-error-validate 
                            [control]="orderForm.controls['email']"
                            [name-control]="'Email'">
                        </app-error-validate>
                </div>
        
                <div class="flex flex-col gap-2 mb-3">
                    <label for="txtPassword" class="form-label">Address</label>
                    <input
                        pInputText pSize="large"
                        formControlName="address"
                        name="txtAddress"
                        type="text" class="form-control"
                        >
                        <app-error-validate 
                        [control]="orderForm.controls['address']"
                        [name-control]="'Address'">
                        </app-error-validate>
                </div>
    
                <app-radio-group
                    [name]="'Shipping method'"
                    [categories]="categories"
                    [groupName]="'shipping'"
                    formControlName="selectedCategory1"
                    (priceChange)="onPriceChange($event)">
                </app-radio-group>
                
                <app-radio-group
                    [name]="'Payment method'"
                    [categories]="paymentCategories"
                    [groupName]="'payment'"
                    formControlName="selectedCategory2"
                ></app-radio-group>
                
                <div class="flex flex-col mt-2">
                    <p-button
                        [disabled]="orderForm.invalid"
                        type="submit"
                        label="Complete the order" [rounded]="true" [raised]="true"
                        fluid />
                </div>
            </form>
        </div>
        
        <div class="bg-(--p-surface-100) max-lg:mt-7">
            <app-dataview></app-dataview>
    
            <div class="flex flex-col gap-3 mt-5 px-3">
                <div class="flex flex-col gap-2">
                    <label for="promotional-code">Promotional code</label>
                    <input pInputText id="promotional-code" />
                </div>
                <div class="flex gap-2 items-center justify-between">
                    <div class="font-semibold">Total:</div>
                    <div>
                        {{ cartService.totalPrice() *1000 | number:'1.0-0' }}₫</div>
                </div>
                <div class="flex gap-2 items-center justify-between">
                    <div class="font-semibold">Shipping fee:</div>
                    <div>
                        {{ shippingPrice() * 1000 | number:'1.0-0' }}₫
                    </div>
                </div>
                <div class="flex gap-2 items-center justify-between pb-8">
                    <div class="font-semibold">Total price:</div>
                    <div class="font-semibold text-2xl">
                        {{ totalPrice() *1000 | number:'1.0-0' }}₫</div>
                </div>
            </div>
        </div>
    </div>
    
} @else {
    <app-empty-cart></app-empty-cart>
}
