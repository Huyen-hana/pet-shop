<div class="w-full h-auto max-lg:mt-[var(--mini-header-height)]">
    <div class="pt-5 font-bold text-xl lg:px-3.75">TẠO MỚI MẬT KHẨU</div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.75 pt-5 lg:px-3.75">
        <form 
            (ngSubmit)="onSubmitForm()"
            [formGroup]="resetPass">
        
            <div class="flex flex-col gap-2">
                <label class="form-label">Email</label>
                <input pInputText pSize="large"
                    formControlName="email"
                    name="txtEmail"
                    type="email" class="form-control">
    
                    <app-error-validate 
                        [control]="resetPass.controls['email']"
                        [name-control]="'Email'">
                    </app-error-validate>
            </div>
            <div class="flex justify-start mt-2 gap-3.75">
                <p-button
                    [type]="'submit'" 
                    [raised]="true"
                    label="Xác nhận" [rounded]="true" />
                <p-button
                    (click)="goHome()"
                    [type]="'button'" 
                    variant="text" severity="secondary"
                    label="Hủy" [rounded]="true" />
            </div>
        </form>
    </div>
</div>
