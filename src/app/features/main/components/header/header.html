<div class="grid grid-rows-[1fr] max-w-[var(--max-width-app)] mx-auto px-7.5 min-h-auto max-lg:relative">
    <!-- row 01 -->
    <div class="flex items-center h-12.5 h-22.5 gap-9 py-4.5 max-lg:hidden">
        <div class="min-w-[var(--logo-width)] flex-shrink-0">
            <a [routerLink]="['/main/home']">
                <div>
                    <img src="https://i.ibb.co/Y7sY4Tf6/Veterinary-Logo-Pet-Shop-Vector-Graphics-19036061-1-removebg-preview.png"
                        alt="LogoDemo"
                        class="w-full h-12.75 object-cover text-(--p-surface-0)">
                </div>
            </a>
        </div>

        <div class="flex-1 min-w-0 mx-9">
            <div class="bg-[var(--light-color)]">search</div>
        </div>

        <div class="flex flex-shrink-0 whitespace-nowrap">
            <div class="flex items-center gap-0.5">
                <div 
                    class="flex items-center px-3 cursor-pointer group">
                    <app-user-drawer
                        [titleMenu]="'Đăng nhập'"
                        [hiddensmallIcon]="true"
                    ></app-user-drawer>
                </div>
                
                <div
                    (click)="toggleMiniCart()"
                    class="flex flex-col items-center pl-3 cursor-pointer group">
                    <div class="relative">
                        <i class="pi pi-shopping-cart text-(--p-surface-0)
                            group-hover:text-(--p-surface-800)
                            transition-all duration-200 ease-in-out"
                            [style]="{ 'font-size': '24px' }">
                        </i>
                        <p-badge 
                            severity="danger"
                            class="absolute -top-2 -right-3 cursor-pointer"
                            badgeSize="small"
                            [value]="totalItems()" />
                    </div>
                    <div
                        class="text-xs text-(--p-surface-0) font-thin select-none
                            group-hover:text-(--p-surface-800)
                            transition-all duration-200 ease-in-out"
                        >Giỏ hàng
                    </div>
                </div>
            </div>
        </div>
    </div >
    <!-- mini-cart -->
    @if (cartService.visibleMiniCart$ | async) {
    <app-mini-cart></app-mini-cart>
    }

    <!-- row 02 -->
     <div class="min-h-12 flex items-center max-lg:hidden">
        <div class="flex-1 min-w-0">
            <app-megamenu [category]="category"></app-megamenu>
        </div>
     </div>

     <!-- row 03: Mobile -->
     <div class="bg-(--p-amber-500) max-lg:fixed top-0 right-0 left-0 lg:hidden z-50">
        <div class="h-12.5 flex items-center sm:gap-6">
            <div class="flex items-center gap-1">

                <!-- left drawer here: menu -->
                 <app-drawer [titleMenu]="'Menu'"
                    [category]="category"
                 ></app-drawer>
                
                <i class="pi pi-search text-(--p-surface-0) p-3.75 cursor-pointer"
                    [style]="{ 'font-size': '15px' }">
                </i>
            </div>
            
            <div class="flex-1 min-w-0">
                <div class="min-w-[var(--logo-width)] flex-shrink-0">
                    <a [routerLink]="['/main/home']">
                        <div>
                            <img src="https://i.ibb.co/Y7sY4Tf6/Veterinary-Logo-Pet-Shop-Vector-Graphics-19036061-1-removebg-preview.png"
                                alt="LogoDemo"
                                class="min-w-24 sm:min-w-28.5 h-9.25 object-cover text-(--p-surface-0) mx-auto max-[345px]:mx-6">
                        </div>
                    </a>
                </div>
            </div>
            
            <div class="flex items-center gap-1">
                <app-user-drawer 
                    [titleMenu]="'Đăng nhập'"
                ></app-user-drawer>

                <div class="relative" (click)="toggleMiniCart()">
                    <i   
                        class="pi pi-shopping-bag text-(--p-surface-0) px-3.75 py-1 cursor-pointer"
                        [style]="{ 'font-size': '16px' }">
                    </i>
                    <p-badge 
                        severity="danger"
                        class="absolute -top-1.5 right-0 cursor-pointer"
                        badgeSize="small"
                        [value]="totalItems()" />
                </div>
            </div>
        </div>
     </div>

     <!-- row 04: sticky header lg screen -->
    <div
        class="lg:fixed top-0 right-0 left-0 max-lg:hidden transition-all duration-300 ease-in-out z-50"
        [ngClass]="{
            'opacity-0 -translate-y-full pointer-events-none': !isNavHidden,
            'opacity-100 translate-y-0 pointer-events-auto': isNavHidden
        }"
    >
        <div class="bg-(--p-amber-500)">
            <div class="h-12.5 max-w-[var(--max-width-app)] flex items-center sm:gap-6 mx-auto px-7.5">
                <div>
                    <app-megamenu [category]="category"></app-megamenu>
                </div>
                <div class="ml-auto">
                    <div class="flex items-center">
                        <i class="pi pi-search text-(--p-surface-0) p-3.75 cursor-pointer"
                            [style]="{ 'font-size': '20px' }">
                        </i>
                        <div class="relative">
                            <i
                                (click)="toggleMiniCart()"
                                class="pi pi-shopping-cart text-(--p-surface-0) p-3.75 cursor-pointer"
                                [style]="{ 'font-size': '22px' }">
                            </i>
                            <p-badge 
                                severity="danger"
                                class="absolute top-2 right-0 cursor-pointer"
                                badgeSize="small"
                                [value]="totalItems()" />
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    
</div>
